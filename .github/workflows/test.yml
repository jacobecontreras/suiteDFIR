name: test

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=60 -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before setup-node: the runner ships Yarn 1 globally, and
      # setup-node's yarn cache detection shells out to `yarn --version` to
      # locate the cache dir. Enabling corepack first makes that resolve to the
      # version pinned in package.json#packageManager.
      - name: Enable corepack
        run: npm install -g corepack && corepack enable

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run frontend tests with coverage
        run: yarn --cwd frontend run test:coverage

      - name: Type-check + build
        run: yarn --cwd frontend run build
